<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelter 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Single dark "space night" look, by design. A live 3D base fills the page; panels float over it. */
:root{
  --bg:#07090e; --panel:rgba(16,21,32,.92); --panel2:#1a2233; --line:#2a3447; --fg:#e9edf3; --muted:#9aa7ba; --dim:#6b778c;
  --sun:#ffb547; --cool:#6fd3c7; --bad:#ff6b5b; --good:#7ddc8a; --mars:#e0774f;
  --f:"Readex Pro", system-ui, sans-serif; --m:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:#44536e}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#1a1205;font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.cool{background:var(--cool);border-color:var(--cool);color:#06201d;font-weight:600}
.btn.sq{padding:8px 11px}
.btn[aria-pressed="true"]{background:var(--cool);border-color:var(--cool);color:#06201d}
.btn:focus-visible,.step button:focus-visible,.opt:focus-visible,.crew:focus-visible,.job:focus-visible,.mk:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
h1{font-size:clamp(30px,5.2vw,56px);line-height:1.06;margin:0 0 12px;text-wrap:balance}
h2{font-size:21px;margin:0 0 6px;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.ok{color:var(--good)} .warn{color:var(--sun)} .bad{color:var(--bad)}
[dir="rtl"] .mono{direction:ltr;unicode-bidi:isolate}
#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:center;text-shadow:0 1px 8px #000}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.hb{display:flex;gap:8px}
.screen{position:relative;z-index:10}
/* intro */
#s-intro{min-height:100%;display:flex;align-items:flex-end;padding:90px 20px 34px;pointer-events:none}
#s-intro .box{max-width:560px;pointer-events:auto;background:linear-gradient(180deg,rgba(7,9,14,0),rgba(7,9,14,.82) 30%);padding:28px 4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:rgba(16,21,32,.7)}
/* panels over 3D */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
#s-setup,#s-build{padding:80px 14px 14px;pointer-events:none}
#s-setup .panel{max-width:760px;margin:0 auto;pointer-events:auto}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.opt{text-align:start;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--sun)}
.opt.mars[aria-pressed="true"]{border-color:var(--mars)}
.opt .big{font-size:34px}
.opt ul{margin:0;padding-inline-start:18px;color:var(--muted);font-size:13px}
.diff{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
#s-build .panel{width:min(480px,100%);pointer-events:auto;max-height:calc(100vh - 80px);overflow:auto}
.budget{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.bar{flex:1;height:9px;background:#0c111a;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun)}
.items{display:grid;gap:6px}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.item .ico{font-size:18px;text-align:center}
.item p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.item .cost{font-family:var(--m);font-size:11.5px;color:var(--dim)}
.step{display:flex;align-items:center;gap:5px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#0c111a;font-size:18px;line-height:1}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:22px;text-align:center;font-family:var(--m);font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stat{background:#0c111a;border-radius:9px;padding:7px 9px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--m);font-size:14.5px;font-weight:500}
/* mission HUD */
#s-sim{position:fixed;inset:0;pointer-events:none}
#s-sim>*{pointer-events:auto}
#hudTop{position:absolute;top:54px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;justify-content:center}
.g{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 10px;min-width:74px}
.g span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.g b{font-family:var(--m);font-size:16px;font-weight:500;white-space:nowrap}
.g .bar{height:5px;margin-top:3px;min-width:60px}
.g.day b{font-size:18px}
#toggles{display:flex;gap:6px;align-items:center}
#goals{position:absolute;left:10px;top:122px;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:4px;font-size:12.5px}
#goals h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#goals .gl{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start;line-height:1.35}
#goals .gl.done{color:var(--good)}#goals .gl.fail{color:var(--bad)}
#buildMenu{position:absolute;right:10px;top:122px;width:250px;background:var(--panel);border:1px solid var(--sun);border-radius:12px;padding:10px;display:grid;gap:6px}
#buildMenu p{font-size:12px;color:var(--muted);margin:0 0 4px}
.bopt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:13.5px;text-align:start}
.bopt:disabled{opacity:.4;cursor:not-allowed}
.bopt b{font-family:var(--m);font-weight:500;color:var(--cool);white-space:nowrap}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 50px rgba(255,60,40,.6);opacity:0;transition:opacity .35s;z-index:9}
#vig.dust{box-shadow:inset 0 0 200px 60px rgba(200,120,60,.55)}
#evt{position:absolute;top:128px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:rgba(60,14,14,.94);border:2px solid var(--bad);border-radius:14px;padding:10px 14px;text-align:center}
#evt h3{font-size:17px;color:#ffd9d4}
#evt p{margin:2px 0 6px;font-size:13.5px;color:#ffc2bb}
#evt .bar i{background:var(--bad)}
#evt.calm{background:rgba(16,40,38,.94);border-color:var(--cool)}
#evt.calm h3{color:#d7f5f0}#evt.calm p{color:#b7e6df}
#hudBot{position:absolute;bottom:10px;left:10px;right:10px;display:grid;gap:8px;justify-items:center}
#jobs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--cool);border-radius:12px;padding:7px}
#jobs .lab{font-size:12.5px;color:var(--cool);align-self:center;padding:0 6px}
.job{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 12px;font-weight:500;font-size:14px}
.job:disabled{opacity:.35;cursor:not-allowed}
.job.hot{border-color:var(--bad);background:#4a1716;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,107,91,.3)}}
#crew{display:grid;grid-template-columns:repeat(4,minmax(0,170px));gap:6px;width:100%;justify-content:center}
.crew{text-align:start;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 9px;min-width:0}
.crew[aria-pressed="true"]{border-color:var(--cool);background:rgba(20,48,46,.95)}
.crew .n{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden}
.crew .dot{width:10px;height:10px;border-radius:50%;flex:none}
.crew .r{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .bar{height:5px;margin:4px 0 3px}
.crew .bar i{background:var(--good)}
.tagl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(7,9,14,.8);border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.tagl.sel{border-color:var(--cool);background:rgba(20,48,46,.95)}
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font-size:12.5px;padding:4px 9px;border-radius:10px;background:#e9edf3;color:#10151f;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.mk{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:rgba(16,21,32,.85);font-size:18px;display:grid;place-items:center;padding:0}
.mk.can{border-color:var(--cool);box-shadow:0 0 0 4px rgba(111,211,199,.22)}
.mk.hot{border-color:var(--bad);background:#4a1716;animation:pulse 1s infinite}
#toast{position:absolute;top:128px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13.5px;max-width:calc(100% - 20px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(5,7,12,.74);display:grid;place-items:center;z-index:60;padding:16px}
.modal .panel{width:min(520px,100%)}
.how{display:grid;gap:8px;margin:10px 0 14px;padding:0;list-style:none}
.how li{background:var(--panel2);border-radius:10px;padding:9px 12px}
/* report + home (solid pages) */
.solid{background:var(--bg);min-height:100%;padding:70px 16px 40px}
.solid .in{max-width:1080px;margin:0 auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.card{background:#101520;border:1px solid var(--line);border-radius:14px;padding:16px}
.stars{font-size:34px;letter-spacing:4px;color:var(--sun)}
.score{font-family:var(--m);font-size:20px;color:var(--cool)}
.lessons{display:grid;gap:8px;margin:12px 0}
.lesson{border-inline-start:3px solid var(--cool);background:#101520;padding:10px 12px;border-radius:8px}
.lesson.badl{border-color:var(--bad)}
.cert{margin-top:12px;border-radius:14px;padding:22px 20px;text-align:center;background:linear-gradient(160deg,#1b2233,#121722 60%);border:3px double #c9a24a}
.cert .k{font-family:var(--m);font-size:11.5px;letter-spacing:.2em;color:#c9a24a;text-transform:uppercase}
.cert .title{font-size:26px;font-weight:700;margin:6px 0}
.cert .name{font-size:22px;color:var(--sun);border-bottom:1px solid #3d4b63;display:inline-block;padding:0 12px 4px;margin:6px 0 10px;min-width:60%}
.cert .meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.field{display:grid;gap:6px;margin-top:12px}
.field input{background:#101520;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chks{display:grid;gap:8px}
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;background:#101520;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--cool)}
.chk p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.chk.rng{cursor:default}
.rrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.rrow input{flex:1;min-width:0;accent-color:var(--cool)}
.rrow output{min-width:120px;font-size:13px;color:var(--cool)}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:#173a35;color:var(--cool);white-space:nowrap}
.cmprow span{font-size:13px;color:var(--muted)}
.cmprow .bar{height:14px;margin-top:4px}
.cmprow .bar i{background:var(--bad)}
.cmprow.me .bar i{background:var(--cool)}
.bigp{font-family:var(--m);font-size:34px;color:var(--cool)}
.try{border:1px dashed #3d4b63;border-radius:14px;padding:16px;margin-top:16px}
.try ol{margin:8px 0 0;padding-inline-start:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.foot{margin-top:26px;font-size:12.5px;color:var(--dim)}
.foot a{color:var(--muted)}
.kick{font-family:var(--m);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#c9a24a;margin:0}
.budget{display:flex;align-items:center;gap:10px;font-size:13px}
.budget .bar{flex:1;height:10px;background:#0c111a;border-radius:99px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:#c9a24a;transition:width .2s}
.budget.over .bar i{background:var(--bad)}
.mmg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.mmg .stat b{font-size:15px;display:block;direction:ltr;unicode-bidi:isolate}
[dir=rtl] .mmg .stat b{text-align:right}
.chk .cost{font-family:var(--m);font-size:12px;color:#c9a24a;white-space:nowrap}
.chk.off{opacity:.45}
#mmEvt .btn{text-align:start;padding:11px 14px}
#mmEvt .btn small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
#certFull{position:fixed;inset:0;z-index:90;background:radial-gradient(ellipse at 50% 30%,#1a2438,#05070c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:1.5vh 1.5vw;overflow:auto}
.bigcert{container-type:inline-size;width:min(97vw,calc((100vh - 70px)*1.414));aspect-ratio:1.414/1;position:relative;flex:none;
  background:radial-gradient(ellipse at 50% 0%,#1d2740,#0e1422 70%);border-radius:1.2cqw;color:#e9edf3;overflow:hidden;
  box-shadow:0 2vh 6vh rgba(0,0,0,.6),0 0 0 1px #3a3020}
.bigcert .fr1{position:absolute;inset:1.6cqw;border:.35cqw solid #c9a24a;border-radius:.8cqw;pointer-events:none}
.bigcert .fr2{position:absolute;inset:2.5cqw;border:.12cqw solid rgba(201,162,74,.55);border-radius:.5cqw;pointer-events:none}
.bigcert .crn{position:absolute;width:6cqw;height:6cqw;pointer-events:none}
.bigcert .dots{position:absolute;inset:0;opacity:.5;pointer-events:none}
.bigcert .body{position:absolute;inset:4.5cqw 7cqw 4cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.bigcert .kick{font-family:var(--m);font-size:1.25cqw;letter-spacing:.35em;color:#c9a24a;text-transform:uppercase;margin:0}
.bigcert .ttl{font-size:5cqw;font-weight:700;line-height:1.05;margin:1.2cqw 0 0;background:linear-gradient(180deg,#f6dc8f,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigcert .ttl2{font-size:2.3cqw;font-weight:600;color:#e3c26f;margin-top:.4cqw;white-space:nowrap}
.bigcert .sub{font-size:1.6cqw;color:#9aa7ba;margin:1.6cqw 0 .4cqw}
.bigcert .nm{font-size:4.4cqw;font-weight:600;color:#fff;min-width:50%;padding:0 2cqw .6cqw;border-bottom:.15cqw solid #c9a24a;line-height:1.25;min-height:5.6cqw}
.bigcert .ach{font-size:1.75cqw;line-height:1.5;max-width:78%;margin:1.6cqw 0 0;color:#d5dbe5}
.bigcert .ach b{color:#f6dc8f;font-weight:600}
.bigcert .st{font-size:3.4cqw;letter-spacing:.5cqw;color:#f6c453;margin-top:1.2cqw;line-height:1}
.bigcert .row{display:flex;gap:2.2cqw;justify-content:center;margin-top:1.4cqw;flex-wrap:wrap}
.bigcert .row div{background:rgba(255,255,255,.04);border:.1cqw solid #2f3a50;border-radius:.8cqw;padding:.6cqw 1.6cqw;min-width:12cqw}
.bigcert .row span{display:block;font-size:1.05cqw;color:#9aa7ba;text-transform:uppercase;letter-spacing:.1em}
.bigcert .row b{font-family:var(--m);font-size:1.8cqw;font-weight:500;color:#6fd3c7}
.bigcert .ft{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw;font-size:1.3cqw;color:#9aa7ba}
.bigcert .sig{border-top:.12cqw solid #4a5670;padding-top:.6cqw}
.bigcert .sig b{display:block;color:#e9edf3;font-weight:500;font-size:1.5cqw}
.bigcert .seal{width:10cqw;height:10cqw}
.rot{display:none;color:var(--muted);font-size:13px}
@media (orientation:portrait) and (max-width:640px){.rot{display:block}}
.certCtl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.certCtl input{background:#101520;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:220px}
@media print{
  body>*:not(#certFull){display:none!important}
  #certFull{position:static;background:none;padding:0;display:block}
  .certCtl{display:none!important}
  .bigcert{width:100%;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:0}
}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){
  .worlds{grid-template-columns:1fr}
  #s-build{padding:0;position:fixed;inset:auto 0 0 0}
  #s-build .panel{width:100%;max-height:58vh;border-radius:16px 16px 0 0}
  .g{min-width:0;padding:5px 8px}.g b{font-size:14px}.g span{font-size:10px}.g .bar{min-width:40px}
  #crew{gap:4px}.crew{padding:6px}.crew .r{display:none}.crew .n{font-size:12.5px}
  .job{padding:8px 9px;font-size:13px}
  #evt,#toast{top:150px}
  #goals{top:auto;bottom:168px;width:180px;font-size:11.5px;padding:6px 8px}
  #buildMenu{top:auto;bottom:168px;width:200px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D view of the space base"></canvas>
<div id="nogl" hidden><p>This game needs WebGL (3D graphics). Please open it in a recent version of Chrome, Edge, Firefox or Safari.</p></div>

<div id="top">
  <div class="brand"><span id="brandN">Shelter 3D</span><small id="brandS">From the Moon to Home · NASA Space Apps 2026</small></div>
  <div class="hb">
    <button class="btn sq" id="pause" hidden aria-label="Pause">⏸</button>
    <button class="btn sq" id="snd" aria-label="Sound">🔊</button>
    <button class="btn" id="lang">عربي</button>
  </div>
</div>

<section class="screen" id="s-intro"><div class="box">
  <h1 id="iH"></h1><p class="muted" id="iP"></p>
  <div class="chips" id="iChips"></div>
  <button class="btn primary" id="start"></button>
  <p class="muted" id="best" style="margin-top:10px;font-size:13px"></p>
</div></section>

<section class="screen" id="s-setup" hidden><div class="panel">
  <h2 id="suH"></h2>
  <div class="worlds">
    <button class="opt" id="w-moon" aria-pressed="true"><span class="big" aria-hidden="true">🌕</span><h3 id="moonN"></h3><ul id="moonFacts"></ul></button>
    <button class="opt mars" id="w-mars" aria-pressed="false"><span class="big" aria-hidden="true">🔴</span><h3 id="marsN"></h3><ul id="marsFacts"></ul></button>
  </div>
  <h3 id="dfH"></h3><div class="diff" id="diff"></div>
  <button class="btn primary" id="toBuild"></button>

  const line=(k,col,w)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();MM.ser.forEach((p,i)=>g[i?'lineTo':'moveTo'](tx(p.h),ty(p[k])));g.stroke()};
  line('Th','#9aa7ba',1.5);line('Tc','#6fd3c7',2.5);
}
function mmStart(){
  MM={h:0,Th:21,Tc:21,RH:47,cond:100,bat:cpick.bat?4:0,closed:false,limit:false,vis:0,ser:[{h:0,Th:21,Tc:21}],log:[],asked:{},done:false,cut:true,hot:0};
  $('mmLog').innerHTML='';$('mmSpeed').hidden=false;mmSpeed=1;$('mmSpeed').textContent='1x';sfx('go');renderCase();mmLoop();
}
function mmLog(t,bad){MM.log.push([t,bad]);$('mmLog').innerHTML=MM.log.slice(-4).reverse().map(l=>`<div class="lesson ${l[1]?'badl':''}">${l[0]}</div>`).join('')}
function mmLoop(){clearTimeout(mmTimer);if(!MM||MM.done||screen!=='home')return;
  if(!$('mmEvt').hidden){mmTimer=setTimeout(mmLoop,200);return}
  for(let k=0;k<mmSpeed*2;k++){mmStep(.25);if(MM.done||!$('mmEvt').hidden)break}
  drawCase();drawChart();gauges();if(!MM.done)mmTimer=setTimeout(mmLoop,120)}
function mmStep(dt){
  const h=MM.h,hod=h%24,inCut=h>=CUT[0]&&h<CUT[1],inCrowd=h>=CROWD[0]&&h<CROWD[1],open=hod>=9&&hod<17;
  if(h>=CUT[0]&&!MM.asked.cut){MM.asked.cut=1;mmEvent('cut');return}
  if(h>=CROWD[0]&&!MM.asked.crowd){MM.asked.crowd=1;mmEvent('crowd');return}
  if(h>=CUT[1]&&!MM.asked.back){MM.asked.back=1;MM.closed=false;mmLog(tt('Power is back. The air conditioner is cooling the hall again.','الكهربا رجعت. التكييف بيبرّد القاعة تاني.'))}
  const v=open&&!MM.closed?(inCrowd?(MM.limit?200:400):150):0;MM.vis+=v*dt;
  const gain=v*(cpick.cur?.5:1);
  const ThT=inCut?tOut(h)-4+gain*.006:21+gain*.004;MM.Th+=(ThT-MM.Th)*dt/(inCut?9:1);
  const lights=open&&!MM.closed&&!inCut?(cpick.led?.2:1.5):0;
  if(inCut&&MM.bat>0){MM.Tc+=(21-MM.Tc)*dt/.5;MM.bat=Math.max(0,MM.bat-dt);if(MM.bat===0)mmLog(tt('The backup battery is empty. The case is on its own now.','البطارية الاحتياطي خلصت. الفترينة لوحدها دلوقتي.'),true)}
  else MM.Tc+=(MM.Th+lights-MM.Tc)*dt/caseTau();
  const RHt=cpick.n2?47:47+v*.012+(inCut?5:0);MM.RH+=(RHt-MM.RH)*dt/(cpick.n2?99:1.5);
  let dmg=0;const T=MM.Tc;if(T>24)dmg+=(T-24)*1.1;if(T>26)dmg+=(T-26)*2;if(T<19)dmg+=.5;
  if(MM.RH>50||MM.RH<45)dmg+=Math.min(Math.abs(MM.RH-47.5)-2.5,6)*.8;
  MM.cond=Math.max(0,MM.cond-dmg*dt);
  if(T>24&&!MM.hot){MM.hot=1;sfx('alarm');mmLog(tt(`Warning: the case passed 24°C (${hhmm(h)}). The king's wrappings start to suffer.`,`تحذير: الفترينة عدّت 24°C (${hhmm(h)}). لفايف الملك بدأت تتأثر.`),true)}
  if(T<23.5)MM.hot=0;
  MM.h+=dt;MM.ser.push({h:MM.h,Th:MM.Th,Tc:MM.Tc});
  if(MM.h>=72){MM.done=true;mmEnd()}
}
function mmEvent(kind){
  sfx('alarm');const box=$('mmEvt');
  const opts=kind==='cut'?[
    [tt('Keep the hall open','خلي القاعة مفتوحة'),tt('More visitors and tickets, but their body heat warms the hall.','زوار وتذاكر أكتر، بس حرارة أجسامهم بتسخّن القاعة.'),()=>{MM.closed=false;mmLog(tt('You kept the hall open during the power cut.','سبت القاعة مفتوحة وقت قطع الكهربا.'))}],
    [tt('Close the hall until the power is back','اقفل القاعة لحد ما الكهربا ترجع'),tt('No visitors, no extra heat. Fewer tickets.','مفيش زوار ولا حرارة زيادة. تذاكر أقل.'),()=>{MM.closed=true;mmLog(tt('You closed the hall to protect the king.','قفلت القاعة عشان تحمي الملك.'))}]]
   :[[tt('Let all 400 in','دخّل الـ 400 كلهم'),tt('Great for learning, but breath adds heat and moisture.','حلو للتعليم، بس النَّفَس بيزوّد حرارة ورطوبة.'),()=>{MM.limit=false;mmLog(tt('400 students per hour are in the hall.','400 طالب في الساعة جوه القاعة.'))}],
    [tt('Small groups only (200 per hour)','مجموعات صغيرة بس (200 في الساعة)'),tt('Less heat and moisture. Some students wait.','حرارة ورطوبة أقل. بعض الطلبة هيستنوا.'),()=>{MM.limit=true;mmLog(tt('Small groups: 200 students per hour.','مجموعات صغيرة: 200 طالب في الساعة.'))}]];
  $('mmEvtH').textContent=kind==='cut'?tt('⚡ Power cut! (Day 2, 13:00)','⚡ الكهربا قطعت! (يوم 2، 1 الضهر)'):tt('🎒 A school trip is at the door! (Day 3, 10:00)','🎒 رحلة مدرسة على الباب! (يوم 3، 10 الصبح)');
  $('mmEvtP').textContent=kind==='cut'?tt(`The emergency generator failed during a 42°C heatwave. The air conditioner will be off for about 6 hours.${cpick.bat?' Your backup battery starts the mini cooler now.':''}`,`مولّد الطوارئ عطل في موجة حر 42°C. التكييف هيفضل واقف حوالي 6 ساعات.${cpick.bat?' البطارية الاحتياطي شغّلت المبرّد الصغير.':''}`):tt('400 students per hour want to see the royal mummies for the next 4 hours. Every visitor breathes out heat and moisture.','400 طالب في الساعة عايزين يشوفوا المومياوات الملكية لمدة 4 ساعات. كل زائر بيطلّع حرارة ورطوبة مع نَفَسه.');
  $('mmEvtB').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='btn';b.innerHTML=`${o[0]}<small>${o[1]}</small>`;b.onclick=()=>{o[2]();sfx('click');box.hidden=true;mmLoop()};$('mmEvtB').appendChild(b)});
  box.hidden=false;
}
function mmEnd(){
  $('mmSpeed').hidden=true;const cond=MM.cond,stars=cond>=88?3:cond>=75?2:cond>=55?1:0,score=Math.round(cond*10+MM.vis/10);
  sfx(stars>=2?'win':'lose');try{mmBest=Math.max(+localStorage.getItem('shelter-mummy')||0,score);localStorage.setItem('shelter-mummy',mmBest)}catch(e){}
  certKing={stars,cond};renderCase();mmResult();
}
function mmResult(){
  const cond=MM.cond,stars=cond>=88?3:cond>=75?2:cond>=55?1:0,score=Math.round(cond*10+MM.vis/10),maxT=Math.max(...MM.ser.map(p=>p.Tc));
  const L2=[];
  if(caseTau()<1.5)L2.push([tt('Your case followed the hall almost instantly. More cork (resistance) and clay blocks (mass) make it change slowly, just like the Moon base walls.','الفترينة كانت بتتغير مع القاعة على طول. فلين أكتر (مقاومة) وبلوكات طين (كتلة) بيخلوها تتغير ببطء، زي حيطان قاعدة القمر بالظبط.'),1]);
  else L2.push([tt(`Good design: your case needs about ${fmt(caseTau(),1)} hours to follow the hall, so a short crisis cannot reach the king fast.`,`تصميم كويس: الفترينة محتاجة حوالي ${fmt(caseTau(),1)} ساعة عشان توصل لحرارة القاعة، فأي أزمة قصيرة مش هتوصل للملك بسرعة.`),0]);
  if(!cpick.n2)L2.push([tt('Without a nitrogen seal, the crowd’s breath changed the humidity inside the case. Real royal-mummy cases are sealed and filled with nitrogen.','من غير قفل النيتروجين، نَفَس الزوار غيّر الرطوبة جوه الفترينة. فترينات المومياوات الملكية الحقيقية محكمة ومليانة نيتروجين.'),1]);
  if(!cpick.led)L2.push([tt('Halogen lamps added heat every opening hour. LEDs are a cheap fix.','لمبات الهالوجين زودت حرارة كل ساعة القاعة مفتوحة فيها. الـ LED حل رخيص.'),1]);
  L2.push([tt('Same idea as your space base: slow the heat (R-value), store it (mass), and plan for the power failing.','نفس فكرة قاعدة الفضاء: بطّأ الحرارة (قيمة R)، وخزّنها (الكتلة)، وجهّز نفسك لو الكهربا قطعت.'),0]);
  $('mmDesign').hidden=true;$('mmRes').hidden=false;
  $('mmRes').innerHTML=`<p class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p><h2 style="margin:0">${stars>=2?tt('The king is safe!','الملك في أمان!'):tt('The king was damaged','الملك اتضرر')}</h2>
   <p class="score">${tt('Score','النتيجة')} ${fmt(score)}${mmBest?` · ${tt('best','الأعلى')} ${fmt(mmBest)}`:''}</p>
   <div class="stats"><div class="stat"><span>${tt("King's condition",'حالة الملك')}</span><b>${fmt(cond)}%</b></div><div class="stat"><span>${tt('Hottest case temperature','أعلى حرارة للفترينة')}</span><b>${fmt(maxT,1)}°C</b></div><div class="stat"><span>${tt('Visitors who saw the king','زوار شافوا الملك')}</span><b>${fmt(MM.vis)}</b></div><div class="stat"><span>${tt('Points mm_spent','النقط المصروفة')}</span><b>${mm_spent()}/${MB}</b></div></div>
   <div class="lessons">${L2.map(l=>`<div class="lesson ${l[1]?'badl':''}">${l[0]}</div>`).join('')}</div>
   <div class="actions">${certSpace||stars>=2?`<button class="btn cool" id="mmCert">🏅 ${tt('Open my certificate','افتح شهادتي')}</button>`:''}<button class="btn primary" id="mmRetry">${tt('Redesign the case','صمّم الفترينة تاني')}</button></div>`;
  if($('mmCert'))$('mmCert').onclick=openCert;$('mmRetry').onclick=()=>{MM=null;$('mmLog').innerHTML='';renderMummy()};
}
$('mmGo').onclick=()=>{if(!MM||MM.done)mmStart()};
$('mmSpeed').onclick=()=>{mmSpeed=mmSpeed===1?3:mmSpeed===3?6:1;$('mmSpeed').textContent=mmSpeed+'x'};

  $('dfH').textContent=tt('Difficulty (cargo points)','مستوى الصعوبة (نقط الحمولة)');$('toBuild').textContent=tt('Next: pack the rocket','التالي: جهّز الصاروخ');

  const links='<p><a href="https://science.nasa.gov/moon/">NASA Moon</a> · <a href="https://science.nasa.gov/mars/">NASA Mars</a> · '+tt(`Built by ${TEAM} for NASA Space Apps 2026 with AI assistance.`,`عمله ${TEAM} لمسابقة NASA Space Apps 2026 بمساعدة الذكاء الاصطناعي.`)+'</p>';
  $('foot1').innerHTML='<p>'+src+'</p>'+links;$('foot2').innerHTML='<p>'+src+'</p>'+links;
